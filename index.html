<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#050508">
    <title>Tracker GPS Live</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <div class="header-left">
            <h1>📍 Tracker Live</h1>
            <span class="live-dot" id="liveDot"></span>
        </div>
        <div class="header-right">
            <button class="theme-btn" onclick="toggleTheme()"><i class="fas fa-moon" id="themeIcon"></i></button>
            <div class="count"><i class="fas fa-users"></i> <span id="userCount">0</span></div>
            <div class="clock"><i class="fas fa-clock"></i> <span id="clock">--:--:--</span></div>
        </div>
    </div>

    <div id="map"></div>

    <div class="map-buttons">
        <button onclick="resetView()" title="Vue globale"><i class="fas fa-globe"></i></button>
        <button onclick="followMe()" title="Ma position"><i class="fas fa-crosshairs"></i></button>
        <button onclick="fitAll()" title="Tout voir"><i class="fas fa-users"></i></button>
        <button onclick="clearRoute()" title="Effacer itinéraire"><i class="fas fa-route"></i></button>
        <button onclick="togglePlaceMode()" id="placeBtn" title="Épingler un lieu"><i class="fas fa-map-pin"></i></button>
        <button onclick="toggleTargetMode()" id="targetBtn" title="Cibler un point"><i class="fas fa-bullseye"></i></button>
        <button onclick="forceRefresh()" id="refreshBtn" title="Actualiser"><i class="fas fa-sync-alt"></i></button>
        <button onclick="togglePlanes()" id="planesBtn" title="Avions en direct"><i class="fas fa-plane"></i></button>
        <button onclick="exportCSV()" id="csvBtn" title="Export CSV"><i class="fas fa-file-csv"></i></button>
        <button onclick="captureMap()" id="captureBtn" title="Capture écran"><i class="fas fa-camera"></i></button>
        <button onclick="toggleSidebarMobile()" title="Voir les positions" style="background:rgba(0,212,255,.3)"><i class="fas fa-list"></i></button>
        <button onclick="toggleFullscreen()" title="Plein écran"><i class="fas fa-expand"></i></button>
        <button onclick="toggleSatellite()" id="satBtn" title="Satellite"><i class="fas fa-satellite"></i></button>
    </div>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2><i class="fas fa-satellite-dish"></i> Unités</h2>
            <button class="toggle-btn" onclick="toggleSidebar()">
                <i class="fas fa-chevron-right" id="toggleIcon"></i>
            </button>
        </div>
        <div id="userList">
            <div class="empty"><i class="fas fa-satellite-dish"></i>En attente...</div>
        </div>
    </div>

    <div class="status-bar" id="statusBar">⏳ Initialisation...</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
